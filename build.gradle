plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'org.jreleaser' version '1.26.0'
}

group = 'com.nulab-inc'
archivesBaseName = 'vite4j'
version = project.property('version')

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    compileJava.options.encoding = 'UTF-8'
    compileTestJava.options.encoding = 'UTF-8'
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // compileOnly: JacksonManifestParser uses it, nothing else does, and it is not passed on to
    // whoever depends on this. Applications that have Jackson - which is most of them - get the
    // parser at whatever version they already run; the rest implement ManifestParser instead.
    compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

javadoc {
    options.locale = 'en_US'
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    title = 'vite4j ' + version + ' API'
}

jar {
    manifest {
        attributes('Implementation-Title': archivesBaseName,
                'Implementation-Version': archiveVersion,
                'Automatic-Module-Name': 'com.nulabinc.vite4j')
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'vite4j'
                description = "Read Vite's build manifest from a JVM backend and render the tags a page needs."
                url = 'https://github.com/nulab/vite4j'
                scm {
                    connection = 'https://github.com/nulab/vite4j.git'
                    developerConnection = 'https://github.com/nulab/vite4j.git'
                    url = 'https://github.com/nulab/vite4j.git'
                }
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit/'
                    }
                }
                developers {
                    developer {
                        id = 'katayama8000'
                        name = 'Tatsufumi Katayama'
                        email = 'tatsufumi.katayama@nulab.com'
                    }
                }
            }
        }
    }

    // JReleaser signs and uploads what lands here; nothing leaves the machine during a build.
    repositories {
        maven {
            name = 'Staging'
            url = uri(layout.buildDirectory.dir('staging-deploy'))
        }
    }
}

// Without this the Gradle plugin ignores jreleaser.yml entirely and falls back to its defaults,
// which carry no deploy, signing or distribution settings at all.
jreleaser {
    configFile = file('jreleaser.yml')
}

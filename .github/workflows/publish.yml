name: Publish to central repository

# Cutting a GitHub release is the deliberate act; this only carries it through to Central. A
# version there can neither be replaced nor withdrawn, so nothing publishes on a plain push.
on:
  release:
    types: [published]
  # A rehearsal: builds, signs and walks the whole deploy, but uploads nothing. For checking the
  # credentials without spending a version, since one on Central cannot be taken back.
  workflow_dispatch:
    inputs:
      version:
        description: Version to rehearse with
        required: true
        default: 0.0.0-rehearsal

jobs:
  publish:
    runs-on: ubuntu-latest

    # The release already exists by the time this runs, so nothing here writes to the repository.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - run: chmod +x gradlew

      # The tag is the single source of truth for the version, so gradle.properties never has to
      # be kept in step with it. v0.1.0 and 0.1.0 are both accepted.
      - name: Read the version off the tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
          else
            version="$INPUT"
          fi
          # A version on Central cannot be taken back, so a mangled one must not get that far. The
          # first try at this condensed the two branches into one expression and wrote both of them,
          # which published 0.1.0v0.1.0 and left 0.1.0 unused.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
            echo "::error::\"$version\" is not a version. The tag was \"$TAG\"."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The signing key has to arrive as the armored block gpg exports. Pasting one through a chat
      # window loses the line breaks, and JReleaser then reports it as a missing *public* key,
      # which sends you looking at the wrong secret. Say plainly what shape the value is in.
      - name: Check the shape of the signing key
        env:
          KEY: ${{ secrets.GPG_SECRET_KEY }}
        run: |
          lines=$(printf '%s' "$KEY" | wc -l | tr -d ' ')
          echo "lines: $lines"
          case "$KEY" in
            "-----BEGIN PGP PRIVATE KEY BLOCK-----"*) echo "starts with: armored PGP header" ;;
            *) echo "starts with: something else" ;;
          esac
          if printf '%s' "$KEY" | base64 -d 2>/dev/null | grep -q "BEGIN PGP"; then
            echo "base64: yes - the value decodes to an armored key"
          else
            echo "base64: no"
          fi
          if [ "$lines" -lt 2 ]; then
            echo "::error::The key is on one line. gpg --armor --export-secret-keys writes many; re-add the secret from a file rather than a paste."
            exit 1
          fi

      - name: Build
        run: ./gradlew build -Pversion=${{ steps.version.outputs.version }}

      - name: Stage the artifacts
        run: ./gradlew publish -Pversion=${{ steps.version.outputs.version }}

      # Deploy only: the release already exists, so JReleaser signs and uploads but does not try to
      # tag or create one. The secret key is read straight from the environment, with no keyring on
      # disk; its public half sits in jreleaser.yml, being public.
      - name: Sign and upload
        run: |
          ./gradlew jreleaserDeploy \
            -Pversion=${{ steps.version.outputs.version }} \
            ${{ github.event_name == 'workflow_dispatch' && '-Djreleaser.dry.run=true' || '' }}
        env:
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
          # A Central Portal user token. backlog4j holds the same thing under OSSRH_* names, kept
          # from before the Portal replaced OSSRH; the names there say nothing about the values.
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USER }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the log from a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-log
          path: |
            build/jreleaser/trace.log
            build/jreleaser/output.properties
